<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="講師画面">
<link rel="manifest" href="manifest-teacher.webmanifest">
<link rel="apple-touch-icon" href="icons/teacher-apple-touch-icon.png">
<link rel="icon" href="icons/teacher-192.png">
<meta name="robots" content="noindex">
<title>講師画面</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="teacher">
<div class="app wide" id="app"></div>

<script src="config.js"></script>
<script src="materials.js"></script>
<script src="lib/supabase.js"></script>
<script src="common.js"></script>
<script>
(function () {
  'use strict';
  const { $, $$, esc, fmtTime, fmtDate, ymd, todayYmd, minutesSince, elapsedText, KIND_LABEL, KIND_ICON, STATUS_LABEL, URGENCY_LABEL, PURPOSE_LABEL, AMOUNT_LABEL, DIFF_LABEL, unmetChecks, rangeField, errorText, toast, store, api } = window.JH;
  const C = window.APP_CONFIG;
  const app = $('#app');
  const BASE_TITLE = '講師画面';

  let pass = store.get('jh_tpass', '');
  let tname = store.get('jh_tname', '');
  let soundOn = store.get('jh_sound', true);
  let tab = 'waiting';           // waiting | in_progress | done | records | settings
  let filterRoom = '', filterKind = '', filterUrgent = false, filterGrade = '', filterSubject = '', filterSchool = '', sortMode = 'time';
  let rows = [];                 // 今日の一覧
  let knownIds = null;           // 新着検知用
  let timer = null;
  let students = [];             // 名簿（講師用）
  let audioCtx = null;
  let lastOk = null, connErr = false, lastOverdueBeep = 0;
  let wakeLock = null;
  const expanded = new Set();     // 「詳細」を開いているカードの id
  let armed = { id: null, until: 0 };  // 「取消」を1回押した状態（自動更新をまたいでも4秒間保持）
  let scoresAll = [];             // 点数（講師だけ）
  let doneDay = todayYmd();       // 完了タブで見る日付
  let doneRows = null;            // 過去日の完了一覧（読み込み結果）
  let recentPrints = [];          // 直近のプリント依頼
  let ctxTimer = null;
  const firstOfMonth = (d) => ymd(new Date(d.getFullYear(), d.getMonth(), 1));
  const lastOfMonth = (d) => ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  let recState = { sid: '', from: firstOfMonth(new Date()), to: todayYmd(), hist: null, report: '' };

  JH.demoBanner();

  // ---------- ログイン ----------
  function renderLogin(msg) {
    document.title = BASE_TITLE;
    app.innerHTML = `<div class="login-wrap">
      <div class="card">
        <h2>講師画面</h2>
        ${msg ? `<div class="small" style="color:var(--danger)">${esc(msg)}</div>` : ''}
        <label class="lbl">合言葉</label>
        <input class="input" id="pass" type="password" autocomplete="current-password" value="${esc(pass)}">
        <label class="lbl">講師名（カードに表示されます）</label>
        <input class="input" id="tname" placeholder="例: 山田" value="${esc(tname)}">
        <button class="btn block mt" id="btnLogin" style="margin-top:18px">入る</button>
      </div></div>`;
    const go = async () => {
      pass = $('#pass').value; tname = $('#tname').value.trim();
      if (!tname) return toast('講師名を入力してください', 'error');
      $('#btnLogin').disabled = true;
      initAudio();
      try { await api.teacherLogin(pass); store.set('jh_tpass', pass); store.set('jh_tname', tname); renderMain(); }
      catch (e) { renderLogin(errorText(e)); }
    };
    $('#btnLogin').onclick = go;
    $('#pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  }

  // ---------- 音・通知・スリープ防止 ----------
  function initAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (_) {} }
  function beep(times) {
    if (!soundOn || !audioCtx) return;
    try {
      for (let i = 0; i < (times || 1); i++) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = i % 2 ? 1046 : 880;
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime + i * 0.25);
        g.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + i * 0.25 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + i * 0.25 + 0.2);
        o.connect(g).connect(audioCtx.destination);
        o.start(audioCtx.currentTime + i * 0.25); o.stop(audioCtx.currentTime + i * 0.25 + 0.22);
      }
    } catch (_) {}
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  }
  document.addEventListener('touchstart', initAudio, { passive: true });
  document.addEventListener('click', initAudio);

  // 画面を開いている間はスリープさせない（対応している端末のみ）
  async function requestWakeLock() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (_) { wakeLock = null; }
  }
  // 画面が裏にいるときの通知（許可した端末のみ。iPhone はホーム画面に追加したときだけ対応）
  async function notify(title, body) {
    try {
      if (!('Notification' in window) || Notification.permission !== 'granted' || document.visibilityState === 'visible') return;
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.showNotification(title, { body, tag: 'jh-new', renotify: true, icon: 'icons/teacher-192.png' });
    } catch (_) {}
  }
  const canNotify = () => 'Notification' in window && 'serviceWorker' in navigator;

  // ---------- メイン ----------
  function renderMain() {
    app.innerHTML = `
      <div class="topbar">
        <div><h1>${BASE_TITLE}</h1><div class="sub">${esc(tname)}${api.mode === 'local' ? '・お試し' : ''}　<span class="conn" id="conn"></span></div></div>
        <div class="row">
          <button class="iconbtn" id="btnSound" title="通知音">${soundOn ? '🔔' : '🔕'}</button>
          <button class="iconbtn" id="btnRefresh" title="更新">↻</button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <div class="tabs" id="tabs">
        <button data-tab="waiting">待ち<span class="cnt" id="cWaiting">0</span></button>
        <button data-tab="in_progress">対応中<span class="cnt" id="cProg">0</span></button>
        <button data-tab="done">完了<span class="cnt" id="cDone">0</span></button>
        <button data-tab="records">記録</button>
        <button data-tab="settings">設定</button>
      </div>
      <div id="body"></div>`;
    $('#btnSound').onclick = () => { soundOn = !soundOn; store.set('jh_sound', soundOn); $('#btnSound').textContent = soundOn ? '🔔' : '🔕'; if (soundOn) { initAudio(); beep(1); } };
    $('#btnRefresh').onclick = () => refresh(true);
    $$('#tabs button').forEach((b) => b.onclick = () => { tab = b.dataset.tab; renderBody(); });
    renderBody();
    refresh(true);
    startTimer();
    requestWakeLock();
    loadContext();
    if (ctxTimer) clearInterval(ctxTimer);
    ctxTimer = setInterval(() => { if (document.visibilityState === 'visible') loadContext(); }, 60000);
  }
  function startTimer() { if (timer) clearInterval(timer); timer = setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, (C.REFRESH_SEC_TEACHER || 5) * 1000); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && pass && rows) { refresh(false); requestWakeLock(); } });

  function setConn() {
    const el = $('#conn'); if (!el) return;
    if (connErr) { el.className = 'conn err'; el.textContent = '⚠ 通信できません（再試行中）'; }
    else { el.className = 'conn'; el.textContent = lastOk ? `更新 ${fmtTime(lastOk)}` : ''; }
  }

  async function refresh(showErr) {
    if (!pass) return;
    try {
      const list = await api.teacherList(pass);
      const newOnes = [];
      if (knownIds) list.forEach((r) => { if (r.status === 'waiting' && !knownIds.has(r.id)) newOnes.push(r); });
      knownIds = new Set(list.map((r) => r.id));
      rows = list; lastOk = new Date().toISOString(); connErr = false; setConn();
      if (newOnes.length) {
        beep(2); toast(`新しい依頼が ${newOnes.length} 件`, 'ok');
        const r = newOnes[0];
        notify(`新しい依頼 ${newOnes.length}件`, `${r.classroom} ${r.student_name}：${KIND_LABEL[r.kind]} ${r.subject}${r.urgency === 'now' ? '（早めに）' : ''}`);
      }
      // 「早めに来てほしい」が放置されていたら1分ごとに再アラート
      const overdue = rows.some((r) => r.status === 'waiting' && r.urgency === 'now' && minutesSince(r.created_at) >= (C.URGENT_ALERT_MIN || 5));
      if (overdue && Date.now() - lastOverdueBeep > 60000) { lastOverdueBeep = Date.now(); beep(1); }
      renderSummary();
      if (['waiting', 'in_progress'].includes(tab)) renderList(newOnes.map((r) => r.id));
      if (tab === 'done' && doneDay === todayYmd()) { doneRows = rows.filter((r) => r.status === 'done' || r.status === 'cancelled'); drawDone(); }
    } catch (e) {
      if (String(e.message).includes('BAD_PASS')) { clearInterval(timer); store.del('jh_tpass'); pass = ''; return renderLogin('合言葉が変わったようです。もう一度入ってください。'); }
      connErr = true; setConn();
      if (showErr) toast(errorText(e), 'error');
    }
  }

  function renderSummary() {
    const waiting = rows.filter((r) => r.status === 'waiting');
    const urgent = waiting.filter((r) => r.urgency === 'now');
    const oldest = waiting.length ? Math.max(...waiting.map((r) => minutesSince(r.created_at))) : 0;
    $('#summary').innerHTML = `
      <div class="tile"><div class="v">${waiting.length}</div><div class="k">待ち</div></div>
      <div class="tile clickable ${urgent.length ? 'alert' : ''} ${filterUrgent ? 'on' : ''}" id="tileUrgent"><div class="v">${urgent.length}</div><div class="k">🔴 早めに</div></div>
      <div class="tile ${oldest >= (C.URGENT_ALERT_MIN || 5) * 2 ? 'alert' : ''}"><div class="v">${oldest}<span style="font-size:.8rem">分</span></div><div class="k">最長の待ち時間</div></div>`;
    $('#tileUrgent').onclick = () => { filterUrgent = !filterUrgent; if (!['waiting', 'in_progress', 'done'].includes(tab)) tab = 'waiting'; renderBody(); renderSummary(); };
    $('#cWaiting').textContent = waiting.length;
    $('#cProg').textContent = rows.filter((r) => r.status === 'in_progress').length;
    $('#cDone').textContent = rows.filter((r) => r.status === 'done').length;
    document.title = waiting.length ? `(${waiting.length}) ${BASE_TITLE}` : BASE_TITLE;
  }

  function renderBody() {
    $$('#tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    const body = $('#body');
    if (tab === 'records') return renderRecords(body);
    if (tab === 'settings') return renderSettings(body);
    if (tab === 'done') return renderDone(body);
    body.innerHTML = `<div class="filters">
        <select id="fRoom"><option value="">全教室</option>${C.CLASSROOMS.map((c) => `<option ${filterRoom === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
        <select id="fKind"><option value="">種類：全部</option><option value="question" ${filterKind === 'question' ? 'selected' : ''}>質問</option><option value="print" ${filterKind === 'print' ? 'selected' : ''}>プリント</option></select>
      </div>
      <div class="filters">
        <select id="fGrade"><option value="">全学年</option>${C.GRADES.map((g) => `<option ${filterGrade === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select>
        <select id="fSchool"><option value="">全学校</option>${C.SCHOOLS.concat([C.SCHOOL_OTHER]).map((x) => `<option ${filterSchool === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
        <select id="fSubject"><option value="">全教科</option>${C.SUBJECTS.map((x) => `<option ${filterSubject === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
        <select id="fSort"><option value="time" ${sortMode === 'time' ? 'selected' : ''}>古い順</option><option value="group" ${sortMode === 'group' ? 'selected' : ''}>学年→教科→単元</option></select>
      </div>
      ${filterUrgent ? '<div class="small" style="color:var(--danger);margin:-4px 0 8px">🔴 「早めに来てほしい」だけ表示中（上のタイルで解除）</div>' : ''}
      <div id="groupBar"></div><div id="list"></div>`;
    $('#fRoom').onchange = (e) => { filterRoom = e.target.value; renderList(); };
    $('#fKind').onchange = (e) => { filterKind = e.target.value; renderList(); };
    $('#fGrade').onchange = (e) => { filterGrade = e.target.value; renderList(); };
    $('#fSchool').onchange = (e) => { filterSchool = e.target.value; renderList(); };
    $('#fSubject').onchange = (e) => { filterSubject = e.target.value; renderList(); };
    $('#fSort').onchange = (e) => { sortMode = e.target.value; renderList(); };
    renderList();
  }

  // 「同じような依頼」の判定: 学年・教科・単元（空白・全角半角の違いは無視）が同じプリント依頼
  const normUnit = (s) => String(s || '').replace(/[\s　]/g, '').replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).toLowerCase();
  const schoolOf = (r) => { if (r.school) return r.school; const st = r.student_id ? students.find((x) => x.id === r.student_id) : null; return (st && st.school) || ''; };
  const groupKey = (r) => `${r.grade}|${schoolOf(r)}|${r.subject}|${normUnit(r.unit_name)}`;
  // 待ち・対応中のプリント依頼のうち、同じグループの件数
  function similarPrints(r) {
    if (r.kind !== 'print' || !r.unit_name) return [];
    const k = groupKey(r);
    return rows.filter((x) => x.id !== r.id && x.kind === 'print' && ['waiting', 'in_progress'].includes(x.status) && groupKey(x) === k);
  }
  const gradeIdx = (g) => { const i = C.GRADES.indexOf(g); return i < 0 ? 99 : i; };
  const subjIdx = (s) => { const i = C.SUBJECTS.indexOf(s); return i < 0 ? 99 : i; };
  function sortRows(items) {
    if (sortMode !== 'group') return items;
    return items.slice().sort((a, b) => gradeIdx(a.grade) - gradeIdx(b.grade) || subjIdx(a.subject) - subjIdx(b.subject)
      || schoolOf(a).localeCompare(schoolOf(b), 'ja') || normUnit(a.unit_name).localeCompare(normUnit(b.unit_name), 'ja') || a.created_at.localeCompare(b.created_at));
  }

  // 完了タブ: 日付を選んで、その日に「いつ・誰に・何を」渡したかを一覧で
  async function renderDone(body) {
    body.innerHTML = `<div class="row" style="margin-bottom:10px">
        <button class="btn xs ghost" id="dPrev">◀ 前日</button>
        <input class="input" type="date" id="dDay" value="${doneDay}" style="flex:1;max-width:190px">
        <button class="btn xs ghost" id="dNext">翌日 ▶</button>
        <button class="btn xs ghost" id="dToday">今日</button>
      </div>
      <div class="filters"><select id="dKind"><option value="">種類：全部</option><option value="print" ${filterKind === 'print' ? 'selected' : ''}>プリント</option><option value="question" ${filterKind === 'question' ? 'selected' : ''}>質問</option></select>
        <select id="dGrade"><option value="">全学年</option>${C.GRADES.map((g) => `<option ${filterGrade === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}</select></div>
      <div id="doneList"><div class="muted small">読み込み中…</div></div>`;
    const shift = (n) => { const d = new Date(doneDay + 'T00:00:00'); d.setDate(d.getDate() + n); doneDay = ymd(d); doneRows = null; renderDone(body); };
    $('#dPrev').onclick = () => shift(-1);
    $('#dNext').onclick = () => shift(1);
    $('#dToday').onclick = () => { doneDay = todayYmd(); doneRows = null; renderDone(body); };
    $('#dDay').onchange = (e) => { if (e.target.value) { doneDay = e.target.value; doneRows = null; renderDone(body); } };
    $('#dKind').onchange = (e) => { filterKind = e.target.value; drawDone(); };
    $('#dGrade').onchange = (e) => { filterGrade = e.target.value; drawDone(); };
    try {
      if (doneDay === todayYmd()) doneRows = rows.filter((r) => r.status === 'done' || r.status === 'cancelled');
      else if (!doneRows) doneRows = (await api.teacherExport(pass, doneDay, doneDay)).filter((r) => r.status === 'done' || r.status === 'cancelled');
      drawDone();
    } catch (e) { $('#doneList').innerHTML = `<div class="small" style="color:var(--danger)">${esc(errorText(e))}</div>`; }
  }
  function drawDone() {
    const box = $('#doneList'); if (!box) return;
    let items = (doneRows || []).slice();
    if (filterKind) items = items.filter((r) => r.kind === filterKind);
    if (filterGrade) items = items.filter((r) => r.grade === filterGrade);
    items.sort((a, b) => String(b.done_at || b.created_at).localeCompare(String(a.done_at || a.created_at)));
    const done = items.filter((r) => r.status === 'done');
    const byTeacher = {}; done.forEach((r) => { const k = r.teacher || '（担当なし）'; byTeacher[k] = (byTeacher[k] || 0) + 1; });
    box.innerHTML = `<div class="card small" style="padding:10px 14px">${doneDay === todayYmd() ? '今日' : esc(doneDay)}：完了 <b>${done.length}</b> 件（プリント ${done.filter((r) => r.kind === 'print').length}・質問 ${done.filter((r) => r.kind === 'question').length}）${Object.keys(byTeacher).length ? '　担当：' + Object.entries(byTeacher).map(([k, v]) => `${esc(k)} ${v}`).join('・') : ''}${items.length - done.length ? `　<span class="muted">取消 ${items.length - done.length}</span>` : ''}</div>`
      + (items.length ? `<div class="handover">${items.map((r) => `<div class="ho ${r.status}" data-id="${r.id}">
          <span class="t">${fmtTime(r.done_at || r.created_at)}</span>
          <span class="w"><b>${esc(r.student_name)}</b><span class="sub">（${esc(r.grade)}${schoolOf(r) ? '・' + esc(schoolOf(r)) : ''}）</span></span>
          <span class="x">${KIND_ICON[r.kind]}<b>${esc(r.subject)}</b> ${esc(r.unit_name || '')}${r.page_range ? ' <span class="sub">' + esc(r.page_range) + '</span>' : ''}${r.kind === 'print' ? `<span class="sub"> ${esc([PURPOSE_LABEL[r.purpose], DIFF_LABEL[r.difficulty], AMOUNT_LABEL[r.amount]].filter(Boolean).join('・'))}</span>` : ''}</span>
          <span class="m">${r.status === 'cancelled' ? '<span class="badge cancelled">取消</span>' : ''}${r.teacher ? `<span class="tag">${esc(r.teacher)}</span>` : ''}${(r.memo_tags || []).map((t) => `<span class="tag ${t === C.FOLLOW_TAG ? 'follow' : ''}">${esc(t)}</span>`).join('')}${r.memo ? `<span class="sub">${esc(r.memo)}</span>` : ''}</span>
          ${doneDay === todayYmd() ? `<span class="b"><button class="btn xs ghost" data-act="done" data-id="${r.id}">メモ</button><button class="btn xs ghost" data-act="reopen" data-id="${r.id}">戻す</button></span>` : ''}
        </div>`).join('')}</div>` : '<div class="empty">この日の完了はありません</div>');
    $$('[data-act]', box).forEach((b) => b.onclick = () => onAction(b.dataset.act, Number(b.dataset.id), b));
  }

  // カード2行目: 種類・教科・目的・単元・ページ・難易度・量・補足
  function detailHtml(r) {
    const parts = [];
    if (r.kind === 'print' && r.purpose) parts.push(`<b>${esc(PURPOSE_LABEL[r.purpose] || r.purpose)}</b>`);
    if (r.unit_name) parts.push(esc(r.unit_name));
    if (r.page_range) parts.push(esc(r.page_range));
    if (r.kind === 'print') { const x = [DIFF_LABEL[r.difficulty], AMOUNT_LABEL[r.amount]].filter(Boolean).join('・'); if (x) parts.push(`<span class="sub">${esc(x)}</span>`); }
    if (r.content) parts.push(esc(r.content));
    return parts.length ? parts.join('　') : '（内容なし）';
  }
  // 記入内容をすべて表で表示（カードの「詳細」・完了モーダルで使う）
  function detailTable(r) {
    const rows = [];
    const st = r.student_id ? students.find((x) => x.id === r.student_id) : null;
    rows.push(['生徒', `${esc(r.student_name)}${r.grade ? `（${esc(r.grade)}）` : ''}${!r.student_id ? '　<span class="unlinked">名簿外</span>' : ''}`]);
    rows.push(['中学校', esc(schoolOf(r) || '（未選択）')]);
    rows.push(['教室', esc(r.classroom)]);
    rows.push(['種類・教科', `${KIND_ICON[r.kind]}${KIND_LABEL[r.kind]}　${esc(r.subject)}`]);
    if (r.kind === 'print') {
      rows.push(['目的', esc(PURPOSE_LABEL[r.purpose] || r.purpose || '')]);
      const p = (C.PRINT_PURPOSES || []).find((x) => x.key === r.purpose);
      if (p && p.needsCheck) {
        const c = r.checks || {};
        rows.push(['事前チェック', (C.PRINT_CHECKS || []).map((k) => `${esc(k.label)} <b class="${c[k.key] === true ? 'ok-txt' : 'ng-txt'}">${c[k.key] === true ? 'やった' : c[k.key] === false ? 'まだ' : '未回答'}</b>`).join('<br>')]);
        if (c.reason) rows.push(['それでも必要な理由', esc(c.reason)]);
      }
      rows.push(['難易度・量', esc([DIFF_LABEL[r.difficulty], AMOUNT_LABEL[r.amount]].filter(Boolean).join('・') || '（未選択）')]);
    } else {
      rows.push(['急ぎ度', r.urgency === 'now' ? `<b class="ng-txt">${esc(URGENCY_LABEL.now)}</b>` : esc(URGENCY_LABEL.later)]);
      if (r.checks && r.checks.thinking) rows.push(['シンキング', 'した（自分で考えてから質問）']);
    }
    rows.push(['単元名', esc(r.unit_name || '（未記入）')]);
    rows.push([rangeField(r.subject).label, esc(r.page_range || '（未記入）')]);
    rows.push([r.kind === 'print' ? '補足' : '一言', esc(r.content || '（なし）')]);
    if (r.kind === 'print') {
      const li = levelInfo(r); const rt = recommendTexts(r, li.rec); const ps = priorSummary(r);
      const hist = li.st ? scoreHistory(li.st.id).slice(0, 4) : [];
      rows.push(['点数（新しい順）', hist.length ? hist.map((x) => `${esc(x.label || x.period)}：${['英語', '数学', '国語', '理科', '社会'].map((k) => x.scores && x.scores[k] != null ? `${k.slice(0, 1)}${x.scores[k]}` : '').filter(Boolean).join(' ')}${x.total != null ? `（5科${x.total}）` : ''}`).join('<br>') : '（データなし）']);
      const tg = (li.st && li.st.targets) || {};
      rows.push(['目標点', `${Object.keys(tg).length ? Object.entries(tg).map(([k, v]) => `${esc(k)}${esc(v)}`).join('・') : '（未設定）'}${li.st ? ` <button class="btn xs ghost" data-act="targets" data-id="${r.id}">目標を設定</button>` : ''}`]);
      rows.push(['おすすめ', `${li.rec ? `<b>${LEVEL_JA[li.rec]}</b>レベル` : 'レベル判定なし（点数・目標がない）'}${li.warns.length ? `<br><span class="ng-txt">⚠ ${li.warns.map(esc).join('。')}</span>` : ''}`]);
      rows.push(['テキスト候補', rt.all.length ? `<div class="mat-list">${rt.all.filter((m) => m.level.includes(rt.level)).map((m) => `<div class="mat ${rt.picked.includes(m) ? 'hit' : ''}"><b>${esc(m.name)}</b> <span class="sub">${m.level.map((l) => LEVEL_JA[l]).join('・')}／${m.uses.map((u) => (PURPOSE_LABEL[u] || u).replace(/用$/, '').replace('苦手だからポイント確認から', 'ポイント確認')).join('・')}</span><br><span class="sub">${esc(m.note)}</span></div>`).join('')}</div>` : '（この教科の教材データなし）']);
      rows.push(['直近のプリント', ps.list.length ? ps.list.slice(0, 5).map((p) => esc(shortPrint(p)) + (p.memo_tags && p.memo_tags.length ? `<span class="sub">　${esc(p.memo_tags.join('・'))}</span>` : '')).join('<br>') : '（なし）']);
    }
    rows.push(['受付', `#${r.receipt_no}　${fmtTime(r.created_at)}${r.started_at ? `　→ 対応開始 ${fmtTime(r.started_at)}` : ''}${r.done_at ? `　→ ${r.status === 'cancelled' ? '取消' : '完了'} ${fmtTime(r.done_at)}` : ''}${r.teacher ? `　担当 ${esc(r.teacher)}` : ''}`]);
    return `<table class="detail">${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table>`;
  }
  function flagsHtml(r) {
    const um = unmetChecks(r);
    const reason = r.checks && r.checks.reason;
    if (!um.length && !reason) return '';
    return `<div class="flags">${um.map((t) => `<span class="flag">${esc(t)}未</span>`).join('')}${reason ? `<span class="sub">理由: ${esc(reason)}</span>` : ''}</div>`;
  }
  // 初期表示用の小さなしるし（詳細を開くと全部見える）
  function miniFlags(r) {
    const um = unmetChecks(r);
    return um.length ? `<span class="flag" title="${esc(um.join('・'))}未">⚠ 確認まだ${um.length}</span>` : '';
  }
  // 初期表示用の1行版（点数→レベル・テキスト・前回）。注意があるときだけ赤
  function assistCompact(r) {
    if (r.kind !== 'print') return '';
    const li = levelInfo(r); const rt = recommendTexts(r, li.rec); const ps = priorSummary(r);
    const parts = [];
    if (li.cur || li.target != null) parts.push(`📈 ${li.cur ? li.cur.value + '点' : ''}${li.target != null ? '/目標' + li.target : ''}${li.rec ? '→' + LEVEL_JA[li.rec] : ''}`);
    if (rt.picked.length) parts.push(`📚 ${esc(rt.picked[0].name)}${rt.picked.length > 1 ? ' ほか' : ''}`);
    if (ps.last) parts.push(`📄 ${ps.today ? '今日' + (ps.today + 1) + '枚目' : '前回' + fmtDate(ps.last.created_at)}${ps.ask ? '（さっきのやった？）' : ''}`);
    if (!parts.length) return '';
    const warn = li.warns.length || ps.ask;
    return `<div class="assist mini ${warn ? 'warn' : ''}">${parts.join('　')}${li.warns.length ? '　⚠' : ''}</div>`;
  }
  function cardHtml(r, isNew) {
    const urgent = r.kind === 'question' && r.urgency === 'now' && r.status === 'waiting';
    const overdue = urgent && minutesSince(r.created_at) >= (C.URGENT_ALERT_MIN || 5);
    const timeTxt = r.status === 'waiting' ? `受付から ${elapsedText(r.created_at)}`
      : r.status === 'in_progress' ? `受付から ${elapsedText(r.created_at)}<span class="sub">（対応 ${elapsedText(r.started_at || r.created_at)}）</span>`
      : r.status === 'done' ? `完了 ${fmtTime(r.done_at)}` : `取消 ${fmtTime(r.done_at)}`;
    const btns = r.status === 'waiting' ? `<button class="btn sm" data-act="start" data-id="${r.id}">対応する</button><button class="btn sm ok" data-act="done" data-id="${r.id}">完了</button>`
      : r.status === 'in_progress' ? `<button class="btn sm ok" data-act="done" data-id="${r.id}">完了にする</button><button class="btn xs ghost" data-act="reopen" data-id="${r.id}">待ちに戻す</button>`
      : r.status === 'done' ? `<button class="btn xs ghost" data-act="done" data-id="${r.id}">メモを直す</button><button class="btn xs ghost" data-act="reopen" data-id="${r.id}">待ちに戻す</button>`
      : `<button class="btn xs ghost" data-act="reopen" data-id="${r.id}">待ちに戻す</button>`;
    const isArmed = armed.id === r.id && Date.now() < armed.until;
    const cancelBtn = ['waiting', 'in_progress'].includes(r.status) ? `<button class="btn xs ${isArmed ? 'danger' : 'ghost'}" data-act="cancel" data-id="${r.id}">${isArmed ? '本当に取消' : '取消'}</button>` : '';
    const linkBtn = !r.student_id ? `<button class="btn xs soft" data-act="link" data-id="${r.id}">名簿に紐づけ</button>` : '';
    const isOpen = expanded.has(r.id);
    const detailBtn = `<button class="btn xs ${isOpen ? 'soft' : 'ghost'}" data-act="detail" data-id="${r.id}">${isOpen ? '閉じる' : '詳細'}</button>`;
    const slipBtn = r.kind === 'print' ? `<button class="btn xs soft" data-act="slip" data-id="${r.id}">📄 指示書</button>` : '';
    const sim = similarPrints(r);
    const simBadge = sim.length ? `<button class="simbadge" data-act="group" data-id="${r.id}" title="同じ学年・教科・単元の依頼">🔁 同じ単元 あと${sim.length}人</button>` : '';
    const tags = (r.memo_tags || []).map((t) => `<span class="tag ${t === C.FOLLOW_TAG ? 'follow' : ''}">${esc(t)}</span>`).join('');
    const longWait = ['waiting', 'in_progress'].includes(r.status) && minutesSince(r.created_at) >= (C.URGENT_ALERT_MIN || 5) * 2;
    return `<div class="req ${r.status} ${urgent ? 'urgent' : ''} ${overdue ? 'overdue' : ''} ${isNew ? 'new' : ''} ${longWait ? 'longwait' : ''}" id="req-${r.id}">
      <div class="l1"><span class="where">${esc(r.classroom)}</span><span class="who">${esc(r.student_name)}${r.grade || schoolOf(r) ? `<span class="muted small">（${esc(r.grade)}${schoolOf(r) ? '・' + esc(schoolOf(r)) : ''}）</span>` : ''}${!r.student_id ? ' <span class="unlinked">名簿外</span>' : ''}</span><span class="time">#${r.receipt_no} ${timeTxt}</span></div>
      <div class="l2 big"><span class="subj">${esc(r.subject)}</span><span class="unit">${esc(r.unit_name || '（単元なし）')}</span><span class="range">${esc(r.page_range || '')}</span></div>
      <div class="l2 tags"><span class="kind">${KIND_ICON[r.kind]}${KIND_LABEL[r.kind]}</span>${r.urgency === 'now' ? '<span class="badge now">早めに</span>' : ''}${r.kind === 'print' ? `<span class="tag">${esc(PURPOSE_LABEL[r.purpose] || '')}</span><span class="tag">${esc([DIFF_LABEL[r.difficulty], AMOUNT_LABEL[r.amount]].filter(Boolean).join('・'))}</span>` : ''}${miniFlags(r)}${simBadge}${r.content && !isOpen ? '<span class="sub">＋補足あり</span>' : ''}</div>
      ${isOpen ? flagsHtml(r) : assistCompact(r)}
      ${isOpen ? assistHtml(r) : ''}
      ${isOpen ? detailTable(r) : ''}
      ${(r.memo || tags) ? `<div class="memo">${tags}${esc(r.memo || '')}</div>` : ''}
      <div class="l3"><span class="meta">${fmtTime(r.created_at)} 受付${r.teacher ? `・担当 ${esc(r.teacher)}` : ''}</span>${detailBtn}${slipBtn}${linkBtn}${cancelBtn}${btns}</div>
    </div>`;
  }

  function renderList(newIds) {
    const list = $('#list'); if (!list) return;
    let items = rows.filter((r) => r.status === tab);
    if (tab === 'done') items = rows.filter((r) => r.status === 'done' || r.status === 'cancelled').slice().reverse();
    if (filterRoom) items = items.filter((r) => r.classroom === filterRoom);
    if (filterKind) items = items.filter((r) => r.kind === filterKind);
    if (filterGrade) items = items.filter((r) => r.grade === filterGrade);
    if (filterSchool) items = items.filter((r) => filterSchool === C.SCHOOL_OTHER ? !C.SCHOOLS.includes(schoolOf(r)) : schoolOf(r) === filterSchool);
    if (filterSubject) items = items.filter((r) => r.subject === filterSubject);
    if (filterUrgent) items = items.filter((r) => r.urgency === 'now');
    items = sortRows(items);
    renderGroupBar(items);
    const nid = new Set(newIds || []);
    list.innerHTML = items.length ? items.map((r) => cardHtml(r, nid.has(r.id))).join('')
      : `<div class="empty">${tab === 'waiting' ? '待っている依頼はありません 🎉' : tab === 'in_progress' ? '対応中の依頼はありません' : '今日の完了はまだありません'}</div>`;
    $$('[data-act]', list).forEach((b) => b.onclick = () => onAction(b.dataset.act, Number(b.dataset.id), b));
    // 2行目（内容）をタップしても詳細を開閉できる
    $$('.req .l2, .req .assist.mini', list).forEach((el) => { el.style.cursor = 'pointer'; el.onclick = (ev) => { if (ev.target.closest('button')) return; const id = Number(el.closest('.req').id.replace('req-', '')); if (expanded.has(id)) expanded.delete(id); else expanded.add(id); renderList(); }; });
  }

  // 表示中のプリント依頼を 学年・教科・単元 でまとめた一覧（2件以上のグループだけ）
  function renderGroupBar(items) {
    const bar = $('#groupBar'); if (!bar) return;
    const prints = items.filter((r) => r.kind === 'print' && ['waiting', 'in_progress'].includes(r.status));
    const groups = {};
    prints.forEach((r) => { const k = groupKey(r); (groups[k] = groups[k] || []).push(r); });
    const multi = Object.values(groups).filter((g) => g.length >= 2).sort((a, b) => b.length - a.length);
    const active = filterGrade || filterSubject || filterKind;
    if (!multi.length && !(active && prints.length >= 2)) { bar.innerHTML = ''; return; }
    bar.innerHTML = `<div class="groupbar">
      ${multi.map((g) => `<button class="groupchip" data-gkey="${esc(groupKey(g[0]))}" data-grade="${esc(g[0].grade)}" data-subject="${esc(g[0].subject)}" data-school="${esc(schoolOf(g[0]))}">🔁 ${esc(g[0].grade)}${schoolOf(g[0]) ? '・' + esc(schoolOf(g[0])) : ''} ${esc(g[0].subject)}「${esc(g[0].unit_name)}」<b>${g.length}人</b></button>`).join('')}
      ${prints.length >= 2 ? `<button class="btn xs" id="btnMultiSlip">📄 表示中のプリント${prints.length}件をまとめて指示書</button>` : ''}
    </div>`;
    $$('.groupchip', bar).forEach((b) => b.onclick = () => { filterKind = 'print'; filterGrade = b.dataset.grade; filterSubject = b.dataset.subject; const sc = b.dataset.school; filterSchool = !sc ? '' : (C.SCHOOLS.includes(sc) ? sc : C.SCHOOL_OTHER); sortMode = 'group'; renderBody(); });
    if ($('#btnMultiSlip')) $('#btnMultiSlip').onclick = () => openMultiSlipModal(prints);
  }
  function openMultiSlipModal(list) {
    const head = `【プリント依頼まとめ】${new Date().toLocaleDateString('ja-JP')}　${list.length}件\n` +
      list.map((r) => `・${r.grade}${schoolOf(r) ? '・' + schoolOf(r) : ''} ${r.student_name}：${r.subject}「${r.unit_name || '-'}」${r.page_range ? ' ' + r.page_range : ''}　${PURPOSE_LABEL[r.purpose] || ''}／${DIFF_LABEL[r.difficulty] || ''}・${AMOUNT_LABEL[r.amount] || ''}`).join('\n');
    const text = head + '\n\n' + list.map((r) => buildSlip(r)).join('\n\n----------------\n\n');
    const bg = modal(`<h3 class="noprint">まとめて指示書（${list.length}件）</h3>
      <div class="small muted noprint">同じ単元の依頼は1枚のプリントで済むことがあります。上の一覧で確認してから、コピーか印刷してください。</div>
      <pre class="report slip" id="slipText">${esc(text)}</pre>
      <div class="row mt noprint"><button class="btn" id="slipCopy">コピー</button><button class="btn ghost" id="slipPrint">🖨 印刷</button><span class="spacer"></span><button class="btn ghost" id="slipClose">閉じる</button></div>`);
    bg.classList.add('print-target');
    $('#slipClose', bg).onclick = () => bg.remove();
    $('#slipPrint', bg).onclick = () => window.print();
    $('#slipCopy', bg).onclick = async () => {
      try { await navigator.clipboard.writeText(text); toast('コピーしました', 'ok'); }
      catch (_) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('コピーしました', 'ok'); }
    };
  }

  async function onAction(act, id, btn) {
    const r = rows.find((x) => x.id === id); if (!r) return;
    if (act === 'detail') { if (expanded.has(id)) expanded.delete(id); else expanded.add(id); return renderList(); }
    if (act === 'slip') return openSlipModal(r);
    if (act === 'targets') return openTargetsModal(r);
    if (act === 'group') { filterKind = 'print'; filterGrade = r.grade; filterSubject = r.subject; const sc = schoolOf(r); filterSchool = !sc ? '' : (C.SCHOOLS.includes(sc) ? sc : C.SCHOOL_OTHER); sortMode = 'group'; return renderBody(); }
    if (act === 'start') return doUpdate(id, 'start', tname, null, null);
    if (act === 'reopen') return doUpdate(id, 'reopen', null, null, null);
    if (act === 'cancel') {
      // 2段階（confirm ダイアログは使わない）。押した状態は自動更新をまたいでも4秒間保持
      if (!(armed.id === id && Date.now() < armed.until)) { armed = { id, until: Date.now() + 4000 }; renderList(); setTimeout(() => { if (armed.id === id && Date.now() >= armed.until) { armed = { id: null, until: 0 }; renderList(); } }, 4100); return; }
      armed = { id: null, until: 0 };
      return doUpdate(id, 'cancel', null, null, null);
    }
    if (act === 'done') return openDoneModal(r);
    if (act === 'link') return openLinkModal(r);
  }
  async function doUpdate(id, action, teacher, memo, tags) {
    try { await api.teacherUpdate(pass, id, action, teacher, memo, tags); await refresh(true); if (tab === 'done') { doneRows = null; renderBody(); } }
    catch (e) { toast(errorText(e), 'error'); }
  }

  function modal(html) {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal">${html}</div>`;
    document.body.appendChild(bg);
    bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
    return bg;
  }
  function openDoneModal(r) {
    const selected = new Set(r.memo_tags || []);
    const bg = modal(`<h3>完了にする：${esc(r.student_name)}（${esc(r.subject)} ${KIND_LABEL[r.kind]}）</h3>
      ${detailTable(r)}
      <label class="lbl">メモ（ボタンで選択・複数可）</label>
      <div class="chips" id="tagChips">${C.MEMO_TEMPLATES.map((t) => `<button class="chip ${selected.has(t) ? 'selected' : ''} ${t === C.FOLLOW_TAG ? 'danger' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <label class="lbl">自由記入（任意）</label>
      <textarea class="input" id="memoText" placeholder="例: 関数の変域でつまずき。類題を渡した">${esc(r.memo || '')}</textarea>
      <label class="lbl">担当講師</label>
      <input class="input" id="memoTeacher" value="${esc(r.teacher || tname)}">
      <div class="row mt" style="margin-top:16px"><button class="btn ghost" id="mCancel">キャンセル</button><span class="spacer"></span><button class="btn ok" id="mSave">完了にする</button></div>`);
    $$('#tagChips .chip', bg).forEach((b) => b.onclick = () => { const t = b.dataset.tag; if (selected.has(t)) selected.delete(t); else selected.add(t); b.classList.toggle('selected'); });
    $('#mCancel', bg).onclick = () => bg.remove();

      $('#mSave', bg).disabled = true;
      await doUpdate(r.id, 'done', $('#memoTeacher', bg).value, $('#memoText', bg).value, Array.from(selected));
      bg.remove();

  }
  // プリント指示書: 依頼内容をテンプレートに当てはめた文面（コピー・印刷用）
  function buildSlip(r) {
    const st = r.student_id ? students.find((x) => x.id === r.student_id) : null;
    const p = (C.PRINT_PURPOSES || []).find((x) => x.key === r.purpose);
    const c = r.checks || {};
    const checks = (p && p.needsCheck) ? (C.PRINT_CHECKS || []).map((k) => `${k.label.replace(/[はを]?(やった|確認した)？$/, '')}:${c[k.key] === true ? '済' : c[k.key] === false ? '未' : '?'}`).join(' ') : '不要（ポイント確認）';
    const d = new Date(r.created_at);
    const vars = {
      date: `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${fmtTime(r.created_at)}`,
      grade: r.grade || '', name: r.student_name, school: schoolOf(r) || '学校名なし', subject: r.subject,
      purpose: PURPOSE_LABEL[r.purpose] || r.purpose || '', unit: r.unit_name || '（未記入）', range: r.page_range || '（未記入）',
      difficulty: DIFF_LABEL[r.difficulty] || '標準', amount: AMOUNT_LABEL[r.amount] || 'ふつう',
      content: r.content || 'なし', checks, reason: c.reason ? `（それでも必要な理由: ${c.reason}）` : '', teacher: r.teacher || tname,
    };
    const li = levelInfo(r); const rt = recommendTexts(r, li.rec);
    vars.score = li.cur ? `${li.cur.value}点（${li.cur.label}）` : 'データなし';
    vars.target = li.target != null ? String(li.target) : '未設定';
    vars.level = li.rec ? LEVEL_JA[li.rec] : '判定なし';
    vars.texts = rt.picked.slice(0, 3).map((m) => m.name).join('／') || 'なし';
    return String(C.PRINT_SLIP_TEMPLATE || '').replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  }
  function openTargetsModal(r) {
    const st = students.find((x) => x.id === r.student_id); if (!st) return;
    const tg = st.targets || {};
    const keys = ['英語', '数学', '国語', '理科', '社会', '5科'];
    const bg = modal(`<h3>目標点：${esc(st.name)}（${esc(st.grade)}）</h3>
      <div class="small muted">次の定期テストの目標。空欄でもOK。おすすめレベルの判定に使います（目標${C.TARGET_HIGH || 85}以上→標準以上、${C.TARGET_LOW || 60}未満→基礎から）。</div>
      <div class="targets">${keys.map((k) => `<label>${esc(k)}<input class="input" type="number" inputmode="numeric" min="0" max="${k === '5科' ? 500 : 100}" data-tk="${esc(k)}" value="${tg[k] != null ? esc(tg[k]) : ''}"></label>`).join('')}</div>
      <div class="row mt" style="margin-top:16px"><button class="btn ghost" id="tgCancel">キャンセル</button><span class="spacer"></span><button class="btn" id="tgSave">保存</button></div>`);
    $('#tgCancel', bg).onclick = () => bg.remove();
    $('#tgSave', bg).onclick = async () => {

  function openSlipModal(r) {
    const text = buildSlip(r);
    const bg = modal(`<h3 class="noprint">プリント指示書：${esc(r.student_name)}（${esc(r.subject)}）</h3>
      <div class="small muted noprint">この文面をコピーして、プリント作成の元（AI・教材システム・手書きの依頼）に使えます。印刷すると指示書だけが出ます。</div>
      <pre class="report slip" id="slipText">${esc(text)}</pre>
      <div class="row mt noprint"><button class="btn" id="slipCopy">コピー</button><button class="btn ghost" id="slipPrint">🖨 印刷</button><span class="spacer"></span><button class="btn ghost" id="slipClose">閉じる</button></div>`);
    bg.classList.add('print-target');
    $('#slipClose', bg).onclick = () => bg.remove();
    $('#slipPrint', bg).onclick = () => window.print();
    $('#slipCopy', bg).onclick = async () => {
      try { await navigator.clipboard.writeText(text); toast('コピーしました', 'ok'); }
      catch (_) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('コピーしました', 'ok'); }
    };
  }
  // 名簿・点数・直近プリントをまとめて読む（カードのおすすめ表示に使う）
  async function loadContext() {
    try {
      const [st, sc, rp] = await Promise.all([api.teacherStudents(pass), api.teacherScoresAll(pass), api.teacherRecentPrints(pass, C.RECENT_PRINT_DAYS || 14)]);
      students = st; scoresAll = sc; recentPrints = rp;
      if (['waiting', 'in_progress'].includes(tab)) renderList();
    } catch (_) {}
  }
  const LEVEL_JA = { basic: '基礎', standard: '標準', advanced: '応用' };
  const LEVEL_ORDER = ['basic', 'standard', 'advanced'];
  const periodDesc = (a, b) => String(b.period).localeCompare(String(a.period));
  // 生徒の点数履歴（新しい順）
  function scoreHistory(sid) { return scoresAll.filter((x) => x.student_id === sid).sort(periodDesc); }
  function latestScore(sid, subject) {
    for (const x of scoreHistory(sid)) { const v = x.scores && x.scores[subject]; if (v != null && v !== '') return { value: Number(v), label: x.label || x.period, period: x.period }; }
    return null;
  }
  // 点数と目標からレベル（基礎/標準/応用）を判定
  function levelInfo(r) {
    const st = r.student_id ? students.find((x) => x.id === r.student_id) : null;
    const cur = st ? latestScore(st.id, r.subject) : null;
    const hist = st ? scoreHistory(st.id).map((x) => x.scores && x.scores[r.subject]).filter((v) => v != null && v !== '').map(Number) : [];
    const prev = hist.length >= 2 ? hist[1] : null;
    const targets = (st && st.targets) || {};
    const target = targets[r.subject] != null ? Number(targets[r.subject]) : null;
    const bands = C.SCORE_BANDS || { standard: 50, advanced: 75 };
    const bandScore = cur ? (cur.value >= bands.advanced ? 'advanced' : cur.value >= bands.standard ? 'standard' : 'basic') : null;
    const bandTarget = target != null ? (target >= (C.TARGET_HIGH || 85) ? 'advanced' : target < (C.TARGET_LOW || 60) ? 'basic' : 'standard') : null;
    let rec = null;
    if (bandScore && bandTarget) { rec = LEVEL_ORDER[Math.max(LEVEL_ORDER.indexOf(bandScore), LEVEL_ORDER.indexOf(bandTarget))]; if (bandScore === 'basic' && rec === 'advanced') rec = 'standard'; }
    else rec = bandScore || bandTarget;
    const warns = [];
    if (r.difficulty === 'basic' && bandTarget === 'advanced') warns.push('目標が高いので基礎だけでは物足りないかも');
    if (r.difficulty === 'basic' && bandScore === 'advanced') warns.push('得意なので基礎は簡単すぎるかも');
    if (r.difficulty === 'advanced' && bandScore === 'basic') warns.push('苦手なので応用は早いかも（まず基礎〜標準）');
    if (r.difficulty === 'advanced' && bandTarget === 'basic') warns.push('目標に対して応用は重いかも');
    return { st, cur, prev, target, targetTotal: targets['5科'] != null ? Number(targets['5科']) : null, bandScore, bandTarget, rec, warns };
  }
  // おすすめテキスト（教科 × レベル × 目的）
  function recommendTexts(r, level) {
    const list = (window.MATERIALS || {})[r.subject] || [];
    const lv = level || r.difficulty || 'standard';
    const byBoth = list.filter((m) => m.level.includes(lv) && (!r.purpose || m.uses.includes(r.purpose)));
    const byLevel = list.filter((m) => m.level.includes(lv));
    const picked = (byBoth.length ? byBoth : byLevel);
    return { picked, all: list, level: lv, exact: byBoth.length > 0 };
  }
  // その生徒の直近プリント（この依頼を除く）
  function priorPrints(r) {
    return recentPrints.filter((p) => p.id !== r.id && (r.student_id ? p.student_id === r.student_id : (!p.student_id && p.student_name === r.student_name)));
  }
  function priorSummary(r) {
    const list = priorPrints(r);
    if (!list.length) return { list, today: 0, week: 0, last: null, ask: false };
    const today = list.filter((p) => p.day === r.day).length;
    const weekFrom = new Date(new Date(r.created_at).getTime() - 7 * 86400e3).toISOString().slice(0, 10);
    const week = list.filter((p) => p.day >= weekFrom).length;
    const last = list[0];
    const ask = last.day === r.day || (last.status === 'done' && (Date.now() - new Date(last.done_at || last.created_at).getTime()) < 3 * 86400e3);
    return { list, today, week, last, ask };
  }
  const shortPrint = (p) => `${fmtDate(p.created_at)} ${p.subject}「${p.unit_name || '-'}」${PURPOSE_LABEL[p.purpose] ? '(' + PURPOSE_LABEL[p.purpose].replace(/用$/, '') + ')' : ''}${p.status === 'done' ? '済' : p.status === 'waiting' ? '待ち' : '対応中'}`;
  // カードの「パッと見」ブロック（プリント依頼だけ）
  function assistHtml(r) {
    if (r.kind !== 'print') return '';
    const li = levelInfo(r);
    const rt = recommendTexts(r, li.rec);
    const ps = priorSummary(r);
    const parts = [];
    let scoreTxt = li.cur ? `直近 ${esc(r.subject)}${li.cur.value}点<span class="sub">（${esc(li.cur.label)}${li.prev != null ? '・前回' + li.prev : ''}）</span>` : `<span class="sub">${esc(r.subject)}の点数データなし</span>`;
    if (li.target != null) scoreTxt += `・目標${li.target}`;
    scoreTxt += li.rec ? ` → <b>${LEVEL_JA[li.rec]}</b>` : '';
    parts.push(`<div class="assist-row">📈 ${scoreTxt}${li.rec && r.difficulty && li.rec !== r.difficulty ? `<span class="sub">（依頼は${esc(DIFF_LABEL[r.difficulty] || '')}）</span>` : ''}</div>`);
    if (rt.picked.length) parts.push(`<div class="assist-row">📚 ${LEVEL_JA[rt.level]}：<b>${rt.picked.slice(0, 3).map((m) => esc(m.name)).join('／')}</b>${rt.picked.length > 3 ? `<span class="sub"> ほか${rt.picked.length - 3}</span>` : ''}</div>`);
    if (li.warns.length) parts.push(`<div class="assist-row warn">⚠ ${li.warns.map(esc).join('。')}</div>`);
    if (ps.last) parts.push(`<div class="assist-row ${ps.ask ? 'warn' : ''}">📄 前回：${esc(shortPrint(ps.last))}${ps.today ? `　<b>今日${ps.today + 1}枚目</b>` : ''}${ps.week >= 3 ? `　<b>7日で${ps.week + 1}枚目</b>` : ''}${ps.ask ? '　→ 「さっきのプリントやった？」' : ''}</div>`);
    return `<div class="assist">${parts.join('')}</div>`;
  }

  function aggregate(hist) {
    const valid = hist.filter((r) => r.status !== 'cancelled');
    const q = valid.filter((r) => r.kind === 'question'), p = valid.filter((r) => r.kind === 'print');
    const by = (arr, key) => { const m = {}; arr.forEach((r) => { const k = key(r); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
    const follow = valid.filter((r) => (r.memo_tags || []).includes(C.FOLLOW_TAG));
    return { valid, q, p, qBy: by(q, (r) => r.subject), pBy: by(p, (r) => r.subject), pPurpose: by(p, (r) => PURPOSE_LABEL[r.purpose] || ''), follow };

  // 講師メモと集計だけを材料に、事実だけを並べた文章を作る
  function buildReport(st, from, to, hist) {
    const a = aggregate(hist);
    const jp = (d) => { const [y, m, dd] = d.split('-'); return `${Number(m)}月${Number(dd)}日`; };
    const lines = [];
    lines.push(`【${st.name || ''}さん（${st.grade || ''}）の学習記録　${jp(from)}〜${jp(to)}】`);
    lines.push('');
    if (!a.valid.length) { lines.push('この期間の質問・プリント依頼の記録はありません。'); return lines.join('\n'); }
    if (a.q.length) {
      const top = a.qBy[0];
      let t = `質問は${a.q.length}回でした`;
      if (a.qBy.length > 1) t += `（${a.qBy.map(([k, v]) => `${k}${v}回`).join('、')}）。${top[0]}を中心に質問に来ていました。`;
      else t += `（すべて${top[0]}）。`;
      lines.push(t);
      const units = a.q.map((r) => r.unit_name).filter(Boolean);
      if (units.length) lines.push(`質問した単元：${Array.from(new Set(units)).join('、')}`);
    } else lines.push('質問の記録はありませんでした。');
    if (a.p.length) {
      lines.push(`プリントの依頼は${a.p.length}回でした（${a.pBy.map(([k, v]) => `${k}${v}回`).join('、')}）。`);
      if (a.pPurpose.length) lines.push(`目的の内訳：${a.pPurpose.map(([k, v]) => `${k}${v}回`).join('、')}`);
      const units = a.p.map((r) => r.unit_name).filter(Boolean);
      if (units.length) lines.push(`取り組んだ単元：${Array.from(new Set(units)).join('、')}`);
    }
    const memoRows = a.valid.filter((r) => r.memo || (r.memo_tags || []).length);
    if (memoRows.length) {
      lines.push('');
      lines.push('講師の記録：');
      memoRows.forEach((r) => {
        const d = new Date(r.created_at);
        const parts = [];
        if ((r.memo_tags || []).length) parts.push(r.memo_tags.join('・'));
        if (r.memo) parts.push(r.memo);
        const what = r.unit_name || r.content || '';
        lines.push(`・${d.getMonth() + 1}/${d.getDate()} ${r.subject}${r.kind === 'question' ? 'の質問' : 'のプリント'}${what ? `「${what}」` : ''}：${parts.join('。')}${r.teacher ? `（担当：${r.teacher}）` : ''}`);
      });
    }
    lines.push('');
    if (a.follow.length) lines.push(`「${C.FOLLOW_TAG}」となった項目が${a.follow.length}件あります。引き続き授業で確認していきます。`);
    else lines.push(`「${C.FOLLOW_TAG}」となった項目はありませんでした。`);
    return lines.join('\n');
  }

  function csvEscape(v) { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }

      const checksTxt = (r) => { const um = unmetChecks(r); const reason = r.checks && r.checks.reason; if (r.kind !== 'print') return ''; if (!um.length && !reason) return (r.purpose && (C.PRINT_PURPOSES.find((x) => x.key === r.purpose) || {}).needsCheck) ? 'すべて済' : ''; return um.map((t) => t + '未').join('／') + (reason ? `（理由: ${reason}）` : ''); };
      const body = data.map((r) => [r.day, r.receipt_no, fmtT(r.created_at), fmtT(r.started_at), fmtT(r.done_at), STATUS_LABEL[r.status], r.student_name, r.grade, schoolOf(r), r.classroom, KIND_LABEL[r.kind], r.subject, PURPOSE_LABEL[r.purpose] || '', r.unit_name, r.page_range, DIFF_LABEL[r.difficulty] || '', AMOUNT_LABEL[r.amount] || '', checksTxt(r), r.content, r.urgency ? URGENCY_LABEL[r.urgency] : '', r.teacher, (r.memo_tags || []).join('／'), r.memo].map(csvEscape).join(','));
      const csv = '﻿' + [head.join(','), ...body].join('\r\n');

        <textarea class="input" id="rosterText" style="min-height:120px" placeholder="佐藤 花子	第一中&#10;鈴木 太郎	第二中"></textarea>
        <label class="small mt" style="display:block"><input type="checkbox" id="rosterReplace"> この学年で、貼り付けた名簿に無い生徒を「無効」にする（退塾者など。記録は残ります）</label>
        <div class="row mt"><button class="btn" id="rosterImport">取り込む</button><span class="small muted" id="rosterPreview"></span></div>
      </div>
      <div class="card">
        <h2>名簿（${students.filter((s) => s.active).length}人）</h2>
        <p class="small muted">退塾した生徒は「無効にする」を押すと、生徒画面の名前一覧から消えます（記録は残り、「戻す」でいつでも復活）。まとめて入れ替えたいときは上の取り込みで「無い生徒を無効にする」にチェック。</p>
        <input class="input" id="rosterFilter" placeholder="名前で絞り込み">
        <table class="tbl mt" id="rosterTable"><tr><th>学年</th><th>氏名</th><th>学校</th><th></th></tr>
        ${students.map((s) => `<tr data-name="${esc(s.name)}" class="${s.active ? '' : 'inactive'}"><td>${esc(s.grade)}</td><td>${esc(s.name)}</td><td>${esc(s.school)}</td><td>${s.active ? `<button class="btn xs ghost" data-deact="${s.id}">無効にする</button>` : `<span class="muted">無効</span> <button class="btn xs soft" data-react="${s.id}">戻す</button>`}</td></tr>`).join('')}</table>
      </div>
      <div class="card">
        <h2>定期テストの点数の取り込み（講師だけが見られます）</h2>
        <p class="small muted">テスト名（例: 2026.3 = 2026年度 2学期中間）を入れ、スプレッドシートの「氏名・英語・数学・国語・理科・社会」の列をコピーして貼り付けてください。名簿の氏名と一致する行だけ取り込みます（空白の違いは無視）。</p>
        <div class="row"><input class="input" id="scPeriod" placeholder="2026.3" style="width:110px"><input class="input" id="scLabel" placeholder="表示名（例: 2026年度 2学期中間）" style="flex:1"></div>
        <textarea class="input mt" id="scText" style="min-height:100px" placeholder="田中健	62	71	55	80	66"></textarea>
        <div class="row mt"><button class="btn" id="scImport">取り込む</button><span class="small muted" id="scPreview"></span></div>
        <div class="small muted mt">点数データ：${scoresAll.length}件（${new Set(scoresAll.map((x) => x.student_id)).size}人）</div>
      </div>
      <div class="card">
        <h2>通知（画面を閉じているとき）</h2>
        <div class="small muted">状態：${notifState}。iPhone は「ホーム画面に追加」したアイコンから開いたときだけ使えます。音とバッジは画面を開いていれば通知の許可なしで動きます。</div>
        ${canNotify() && Notification.permission === 'default' ? '<button class="btn mt" id="btnNotify">通知を許可する</button>' : ''}
      </div>
      <div class="card">
        <h2>合言葉の変更</h2>
        <input class="input" id="newPass" placeholder="新しい合言葉（4文字以上）">
        <button class="btn mt" id="btnPass">変更する</button>
      </div>
      <div class="card">
        <h2>この端末</h2>
        <div class="small muted">講師名：${esc(tname)}　／　通知音：${soundOn ? 'ON' : 'OFF'}（右上の🔔で切替）　／　スリープ防止：${wakeLock ? 'ON' : ('wakeLock' in navigator ? 'OFF（画面をタップすると有効）' : '非対応')}</div>
        <div class="small muted mt">ホーム画面に追加すると、アプリのように開けます（iPhone: 共有ボタン → 「ホーム画面に追加」）。</div>
        <div class="row mt"><a class="btn ghost sm" href="qr.html" target="_blank">掲示用QRを開く</a><button class="btn ghost sm" id="btnLogout">ログアウト</button></div>
      </div>`;
    const parseRoster = () => {
      const grade = $('#rosterGrade').value;
      const text = $('#rosterText').value.trim(); if (!text) return [];
      return text.split(/\r?\n/).map((line) => line.split(/\t|,/).map((c) => c.trim().replace(/^"|"$/g, '')))
        .filter((c) => c.length >= 1 && c[0])
        .filter((c) => !/^(氏名|名前|生徒名|name)/i.test(c[0]))
        .map((c) => ({ student_no: `${grade}_${c[0].replace(/[\s　]/g, '')}`, name: c[0], grade, school: c[1] || '' }));
    };
    $('#rosterFilter').addEventListener('input', (e) => { const q = e.target.value.replace(/[\s　]/g, ''); $$('#rosterTable tr[data-name]').forEach((tr) => { tr.style.display = !q || tr.dataset.name.replace(/[\s　]/g, '').includes(q) ? '' : 'none'; }); });
    $$('[data-deact]').forEach((b) => b.onclick = async () => {
      if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = '本当に無効にする'; b.classList.add('danger'); setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = '無効にする'; b.classList.remove('danger'); } }, 4000); return; }
      try { await api.teacherSetStudentActive(pass, Number(b.dataset.deact), false); toast('無効にしました', 'ok'); students = []; renderSettings(body); } catch (e) { toast(errorText(e), 'error'); }
    });
    $$('[data-react]').forEach((b) => b.onclick = async () => {
      try { await api.teacherSetStudentActive(pass, Number(b.dataset.react), true); toast('戻しました', 'ok'); students = []; renderSettings(body); } catch (e) { toast(errorText(e), 'error'); }
    });
    $('#rosterText').addEventListener('input', () => { const rs = parseRoster(); $('#rosterPreview').textContent = rs.length ? `${rs.length}人を読み取りました` : ''; });
    $('#rosterImport').onclick = async () => {
      const rs = parseRoster(); if (!rs.length) return toast('読み取れる行がありません', 'error');
      const replace = $('#rosterReplace').checked;
      const btn = $('#rosterImport');
      if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = `${rs.length}人を取り込む（もう一度押す）`; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = '取り込む'; } }, 5000); return; }
      try {
        let rows = rs;
        if (replace) {
          // 学年内の置き換え: 他学年の生徒は現状維持のリストに含めて送る
          const grade = $('#rosterGrade').value;
          rows = rs.concat(students.filter((s) => s.grade !== grade && s.active).map((s) => ({ student_no: s.student_no, name: s.name, grade: s.grade, school: s.school })));
        }
        const res = await api.teacherImportStudents(pass, rows, replace); toast(`${rs.length}人を取り込みました`, 'ok'); renderSettings(body);
      } catch (e) { toast(errorText(e), 'error'); }
    };
    const normName = (x) => String(x || '').replace(/[\s　]/g, '');
    const parseScores = () => {
      const period = $('#scPeriod').value.trim(); const label = $('#scLabel').value.trim() || period;
      const text = $('#scText').value.trim(); if (!period || !text) return [];
      const byName = new Map(students.filter((s) => s.active).map((s) => [normName(s.name), s]));
      return text.split(/\r?\n/).map((line) => line.split(/\t|,/).map((c) => c.trim())).filter((c) => c[0] && byName.has(normName(c[0])) && c.length >= 2)
        .map((c) => { const s = byName.get(normName(c[0])); const sc = {}; ['英語', '数学', '国語', '理科', '社会'].forEach((k, i) => { const v = Number(c[i + 1]); if (c[i + 1] !== '' && c[i + 1] != null && !isNaN(v)) sc[k] = v; });
          const vals = Object.values(sc); return { student_no: s.student_no, period, label, grade_at: null, scores: sc, rank: null, total: vals.length === 5 ? vals.reduce((a, b) => a + b, 0) : null }; });
    };
    $('#scText').addEventListener('input', () => { const rs = parseScores(); $('#scPreview').textContent = rs.length ? `${rs.length}人分を読み取りました` : ''; });
    $('#scImport').onclick = async () => {
      const rs = parseScores(); if (!rs.length) return toast('読み取れる行がありません（テスト名と氏名を確認）', 'error');
      const btn = $('#scImport');
      if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = `${rs.length}人分を取り込む（もう一度押す）`; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = '取り込む'; } }, 5000); return; }
      try { const res = await api.teacherImportScores(pass, rs); toast(`${res.imported}件を取り込みました`, 'ok'); await loadContext(); renderSettings(body); }
      catch (e) { toast(errorText(e), 'error'); }
    };
    if ($('#btnNotify')) $('#btnNotify').onclick = async () => { try { const p = await Notification.requestPermission(); toast(p === 'granted' ? '通知を許可しました' : '許可されませんでした'); renderSettings(body); } catch (_) {} };
    $('#btnPass').onclick = async () => {
      const nw = $('#newPass').value.trim();
      const btn = $('#btnPass');
      if (btn.dataset.armed !== '1') { if (nw.length < 4) return toast('4文字以上にしてください', 'error'); btn.dataset.armed = '1'; btn.textContent = `「${nw}」に変更する（もう一度押す）`; setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = '変更する'; } }, 5000); return; }
      try { await api.teacherSetPass(pass, nw); pass = nw; store.set('jh_tpass', pass); toast('合言葉を変更しました。他の講師にも伝えてください', 'ok'); $('#newPass').value = ''; btn.dataset.armed = ''; btn.textContent = '変更する'; }
      catch (e) { toast(errorText(e), 'error'); }
    };
    $('#btnLogout').onclick = () => { store.del('jh_tpass'); pass = ''; clearInterval(timer); renderLogin(); };
  }

  // ---------- 開始 ----------
  if (pass) { api.teacherLogin(pass).then(renderMain).catch((e) => renderLogin(errorText(e))); }
  else renderLogin();
})();
</script>
</body>
</html>
